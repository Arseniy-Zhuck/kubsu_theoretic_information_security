<!doctype html><html lang="ru"><meta charset="utf-8">
<title>Магазин учебных монет</title>
<style>body{font:19px system-ui;background:#111827;color:#eef2ff;max-width:800px;margin:50px auto;padding:20px}section{background:#263349;padding:24px;border-radius:16px;margin:20px 0}button{padding:12px;font:inherit;cursor:pointer}table{width:100%;text-align:left}#result{color:#82efca}</style>
<h1>Магазин учебных монет</h1><p>Локальный стенд. Настоящих платежей нет.</p>
<section><h2>Баланс: {{ balance }} монет</h2>
<h2>{{ product.name }}</h2><p>Цена: {{ product.price }} монет</p>
<button onclick="buy()">Купить</button><p id="result"></p></section>
<section><h2>Сохранённые заказы</h2><table><tr><th>Номер</th><th>Товар</th><th>Оплачено</th></tr>
{% for order in orders %}<tr><td>{{ order[0] }}</td><td>{{ order[1] }}</td><td>{{ order[2] }}</td></tr>{% else %}<tr><td colspan="3">Заказов пока нет</td></tr>{% endfor %}</table></section>
<form action="/reset" method="post"><button>Сбросить опыт: 100 монет, без заказов</button></form>
<script>
async function buy() {
 const response = await fetch("/buy", {method:"POST",headers:{"Content-Type":"application/json"},
 body:JSON.stringify({product_id:"robot",price:10000})});
 const data=await response.json();
 document.getElementById("result").textContent=data.message;
}
</script></html>
